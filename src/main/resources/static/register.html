<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Personal Finance Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <h1>Personal Finance Manager</h1>
</header>

<main class="container">
    <h2>Register</h2>
    <form id="register-form">
        <div class="form-group">
            <label for="register-name">Name:</label>
            <input type="text" id="register-name" name="name" required>
        </div>
        <div class="form-group">
            <label for="register-email">Email:</label>
            <input type="email" id="register-email" name="email" required>
        </div>
        <div class="form-group">
            <label for="register-password">Password:</label>
            <input type="password" id="register-password" name="password" required>
            <!-- Add password confirmation if desired -->
        </div>
        <div class="form-group">
            <label for="register-currency">Preferred Currency (e.g., USD, EUR):</label>
            <input type="text" id="register-currency" name="currency" required maxlength="3">
        </div>
        <button type="submit" class="btn">Register</button>
        <p id="register-error" class="error-message" style="display: none;"></p>
        <p id="register-success" class="success-message" style="display: none;"></p>
    </form>
    <p>Already have an account? <a href="index.html">Login here</a>.</p>
</main>

<footer>
    <p>© 2025 Personal Finance Manager</p>
</footer>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
