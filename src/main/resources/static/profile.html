<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Personal Finance Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
    <h1>User Profile</h1>
    <nav>
        <a href="dashboard.html">Dashboard</a> |
        <button id="logout-button" class="btn-link">Logout</button>
    </nav>
</header>

<main class="container">
    <section class="card">
        <h2>Profile Information</h2>
        <div id="profile-info">
            <p><strong>Name:</strong> <span id="profile-name">Loading...</span></p>
            <p><strong>Email:</strong> <span id="profile-email">Loading...</span></p>
            <p><strong>Preferred Currency:</strong> <span id="profile-currency">Loading...</span></p>
            <p id="profile-load-error" class="error-message" style="display: none;"></p>
        </div>
    </section>

    <section class="card">
        <h2>Update Profile</h2>
        <form id="update-profile-form">
            <div class="form-group">
                <label for="update-name">Name:</label>
                <input type="text" id="update-name" name="name" required>
            </div>
            <div class="form-group">
                <label for="update-currency">Preferred Currency (e.g., USD, EUR):</label>
                <input type="text" id="update-currency" name="currency" required maxlength="3">
            </div>
            <!-- Email/Password updates are more complex, often require separate flows -->
            <button type="submit" class="btn">Update Profile</button>
            <p id="profile-update-error" class="error-message" style="display: none;"></p>
            <p id="profile-update-success" class="success-message" style="display: none;"></p>
        </form>
    </section>
</main>

<footer>
    <p>© 2025 Personal Finance Manager</p>
</footer>

<script src="js/api.js"></script>
<script src="js/auth.js"></script> <!-- Needed for logout -->
<script src="js/profile.js"></script>
</body>
</html>
